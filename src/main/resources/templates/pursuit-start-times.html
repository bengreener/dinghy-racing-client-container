 <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="../normalize.css"/>
		<link rel="stylesheet" href="../main.css"/>
		<link rel="stylesheet" href="../w3.css"/>
		<link rel="stylesheet" href="../w3-bginfosys-extensions.css"/>
    	<link rel="stylesheet" href="../external/local.css" />
		<title>Pursuit Starts</title>
	</head>
	<body class="print-no-scroll" style="height:100vh;overflow:auto;">
		<img class="club-pennant" />
		<h1 class="w3-center club-pennant-before" >Chipstead Sailing Club</h1>
		<h2 class="w3-center" th:text="|${race.name} Class Starts|" ></h2>
		<button class="no-print" onclick="window.print()">Print Starts</button>
		<div>
		<table class="result-table bgis-table bgis-border-2 w3-border-black w3-auto">
			<tr>
				<th class="bgis-border-2 w3-border-black bgis-table-cell">Class</th>
				<th class="bgis-border-2 w3-border-black bgis-table-cell">Start Time</th>
				<th class="bgis-border-2 w3-border-black bgis-table-cell">Offset</th>
				<th class="bgis-border-2 w3-border-black bgis-table-cell">Portsmouth Number</th>
			</tr>
			<tr class="bgis-border-2" th:each="classStart: ${dinghyClassStarts}" >
				<td class="bgis-border-2 w3-border-black bgis-table-cell" th:text="${classStart.dinghyClass.name}" />
				<td class="bgis-border-2 w3-border-black bgis-table-cell" th:text="${#temporals.format(classStart.startTime, 'HH:mm:ss')}" />
				<td class="bgis-border-2 w3-border-black bgis-table-cell" th:text="${@durationFormatter.format(classStart.startTimeOffset)}" />
				<td class="bgis-border-2 w3-border-black bgis-table-cell" th:text="${classStart.dinghyClass.portsmouthNumber}" />
			</tr>
		</table>
		</div>
	</body>
</html>
